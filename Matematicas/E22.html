<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ensayo PAES Matemática M1 | Preparación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- KaTeX CSS y JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --deep-green: #0a2f1f;
  --pine: #145c33;
  --mint: #2a7f49;
  --lime: #9bcd6c;
  --gold-soft: #d4b87a;
  --green-light: #e8f5e9;
  --green-bg: #f1f8f0;
  --white: #ffffff;
  --dark-text: #1a2e22;
  --gray: #5a6e5e;
  --border: #c8e0cf;
  --accent: #3c9e5c;
  --red: #c0392b;
  --orange: #e67e22;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Source Sans 3',sans-serif;
  background: linear-gradient(135deg, var(--deep-green) 0%, var(--pine) 50%, var(--mint) 100%);
  min-height:100vh;
}

/* ── HEADER ── */
.header{
  background:var(--deep-green);
  border-bottom:3px solid var(--lime);
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}
.header h1{
  font-family:'Playfair Display',serif;
  color:var(--white);
  font-size:1.3rem;
  display:flex;
  align-items:center;
  gap:10px;
}
.header h1 span{color:var(--lime);}
.timer{
  background:rgba(0,0,0,0.3);
  padding:8px 20px;
  border-radius:40px;
  font-family:'JetBrains Mono',monospace;
  font-size:1.2rem;
  font-weight:700;
  color:var(--lime);
}
.timer.timer-naranja{color:var(--orange);}
.timer.timer-rojo{color:var(--red);}
.timer.timer-urgente{animation:pulse 1s infinite;}

@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:0.6;}
}

/* ── PROGRESS BAR ── */
.progress-container{
  background:rgba(0,0,0,0.3);
  height:6px;
}
.progress-bar{
  height:100%;
  background:var(--lime);
  width:0%;
  transition:width .3s;
}

/* ── MAIN CONTAINER ── */
.main-container{
  max-width:900px;
  margin:0 auto;
  padding:28px 20px 100px;
}

/* ── QUESTION CARD ── */
.question-card{
  background:var(--white);
  border-radius:24px;
  padding:28px 32px;
  box-shadow:0 12px 30px rgba(0,0,0,0.2);
  margin-bottom:24px;
}
.question-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:12px;
  border-bottom:2px solid var(--border);
}
.question-number{
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;
  color:var(--gray);
  letter-spacing:.1em;
}
.question-status{
  font-size:.7rem;
  padding:4px 10px;
  border-radius:20px;
  background:var(--green-light);
  color:var(--pine);
}
.question-text{
  font-size:1rem;
  line-height:1.6;
  color:var(--dark-text);
  margin-bottom:24px;
}
.question-text .math-expr{font-family:'JetBrains Mono',monospace;background:var(--green-light);padding:2px 6px;border-radius:6px;}
.question-text .fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;}
.question-text .fraction .num{border-bottom:1px solid var(--dark-text);padding:0 4px;}
.question-text .fraction .den{padding:0 4px;}
.question-text .table{font-size:.85rem;margin:10px auto;}
.question-text img{max-width:100%;border-radius:12px;margin:10px 0;}

/* ── OPTIONS ── */
.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.option{
  background:var(--green-light);
  border:2px solid var(--border);
  border-radius:16px;
  padding:14px 20px;
  cursor:pointer;
  transition:all .2s;
  font-size:.95rem;
  color:var(--dark-text);
}
.option:hover:not(.locked){
  border-color:var(--accent);
  background:#d4efdf;
  transform:translateX(4px);
}
.option.selected{
  border-color:var(--accent);
  background:#c8e6d5;
}
.option.locked{cursor:default;opacity:0.9;}
.option.correct{
  border-color:var(--accent);
  background:var(--green-light);
}
.option.wrong{
  border-color:var(--red);
  background:#fdeaea;
}
.option img{max-width:200px;border-radius:8px;vertical-align:middle;}

/* ── NAV BUTTONS ── */
.nav-buttons{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:16px;
}
.nav-btn{
  background:var(--pine);
  color:var(--white);
  border:none;
  border-radius:40px;
  padding:12px 28px;
  font-family:'Source Sans 3',sans-serif;
  font-weight:700;
  font-size:.9rem;
  cursor:pointer;
  transition:all .2s;
}
.nav-btn:hover:not(:disabled){
  background:var(--mint);
  transform:scale(1.02);
}
.nav-btn:disabled{
  background:var(--gray);
  cursor:not-allowed;
  opacity:0.5;
}
.nav-btn.next{background:var(--accent);}
.nav-btn.next:hover:not(:disabled){background:#2d7a45;}

/* ─── RESULTS ─── */
.results-container{
  background:var(--white);
  border-radius:24px;
  padding:32px;
  margin-bottom:24px;
}
.score-display{
  text-align:center;
  padding:24px;
  background:linear-gradient(135deg, var(--green-light), var(--white));
  border-radius:20px;
  margin-bottom:24px;
}
.score-number{
  font-family:'Playfair Display',serif;
  font-size:3.5rem;
  font-weight:900;
  color:var(--pine);
}
.score-description{
  color:var(--gray);
  font-size:.9rem;
  margin-top:8px;
}
.excluded-questions{
  background:var(--green-light);
  padding:16px 20px;
  border-radius:16px;
  margin-bottom:24px;
  border-left:4px solid var(--gold-soft);
}
.results-list{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.result-item{
  background:var(--green-light);
  border-radius:16px;
  padding:16px 20px;
}
.result-item.correct{border-left:4px solid var(--accent);}
.result-item.incorrect{border-left:4px solid var(--red);}
.result-item.excluded{border-left:4px solid var(--gold-soft);opacity:0.8;}
.result-item .q-title{
  font-weight:700;
  color:var(--deep-green);
  margin-bottom:8px;
}
.result-item .answer{
  font-size:.85rem;
  color:var(--gray);
  margin-top:6px;
}
.restart-btn{
  background:var(--accent);
  color:var(--white);
  border:none;
  border-radius:40px;
  padding:14px 32px;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:all .2s;
  display:block;
  margin:20px auto 0;
}
.restart-btn:hover{
  background:#2d7a45;
  transform:scale(1.02);
}

/* ── UTILS ── */
.hidden{display:none;}
.text-center{text-align:center;}

@media(max-width:600px){
  .header{padding:12px 16px;}
  .header h1{font-size:1rem;}
  .timer{font-size:.9rem;padding:4px 12px;}
  .question-card{padding:20px;}
  .option{padding:10px 16px;}
  .nav-btn{padding:8px 20px;}
}
/* ── RETROALIMENTACIÓN MEJORADA ── */
.result-item {
  background: var(--green-light);
  border-radius: 16px;
  padding: 18px 22px;
  border-left: 5px solid var(--gray);
}
.result-item.correct   { border-left-color: var(--accent); background: #eefaf1; }
.result-item.incorrect { border-left-color: var(--red);    background: #fdf0ef; }
.result-item.excluded  { border-left-color: var(--gold-soft); opacity: 0.85; }
.result-item.unanswered{ border-left-color: var(--gray);   background: #f4f6f5; }

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.q-title { font-weight: 700; color: var(--deep-green); }

.q-badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.05em;
}
.q-badge.correct   { background: #c8e6d5; color: #1b5e20; }
.q-badge.incorrect { background: #f5c6c0; color: #8b1e12; }
.q-badge.excluded  { background: #f3e6c4; color: #7a5c1e; }
.q-badge.unanswered{ background: #e0e6e2; color: #4a5a4e; }

.q-statement {
  font-size: 0.95rem;
  color: var(--dark-text);
  line-height: 1.55;
  margin-bottom: 14px;
}
.q-statement img { max-width: 100%; border-radius: 10px; margin: 8px 0; }
.q-statement table { margin: 10px auto; }

.answer-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px dashed var(--border);
  padding-top: 12px;
}
.answer-line {
  display: flex;
  gap: 8px;
  font-size: 0.9rem;
  align-items: baseline;
  flex-wrap: wrap;
}
.answer-line.ok  { color: #1b5e20; }
.answer-line.bad { color: #8b1e12; text-decoration: line-through; text-decoration-color: rgba(139,30,18,.4); }
.answer-label { font-weight: 700; min-width: 140px; color: var(--gray); }
.answer-line.ok  .answer-label { color: #2e7d32; }
.answer-line.bad .answer-label { color: #c0392b; }
.answer-value { flex: 1; }
.answer-note {
  font-size: 0.8rem;
  color: #7a5c1e;
  font-style: italic;
  margin-top: 4px;
}
</style>
</head>
<body>

<div class="header">
  <h1>📐 Ensayo PAES <span>Matemática M1</span></h1>
  <div class="timer" id="timer">02:20:00</div>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

<div class="main-container" id="mainContainer">
  <div id="quizContent"></div>
  <div class="nav-buttons" id="navButtons">
    <button class="nav-btn" id="prevBtn" onclick="previousQuestion()">← Anterior</button>
    <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">Siguiente →</button>
  </div>
</div>

<script>
// ============================================================
// POOL DE PREGUNTAS - 65 preguntas
// ============================================================
const questions = [
// 1. 2026R - Imagen: Si - Tabla: No - Resp: B
{
    pregunta: `En un juego hay dos tipos de cartas, unas tienen una estrella y las otras tienen un corazón, todas con un número.<br><br>
    El puntaje de cada jugador se calcula de la siguiente forma:<br><br>
    • Primero se extrae una carta al azar (carta inicial) y su valor se considera como puntaje inicial.<br><br>
    • Luego, se extrae otra carta:<br>
    &nbsp;&nbsp;&nbsp;&nbsp;o si esta tiene una estrella, le debe restar el valor de la carta a su puntaje;<br>
    &nbsp;&nbsp;&nbsp;&nbsp;o si esta tiene un corazón, le debe sumar el valor de la carta a su puntaje.<br><br>
    • El puntaje final se obtiene al repetir el procedimiento anterior, hasta tener diez cartas.<br><br>
    Un jugador extrae las siguientes cartas, en este orden:<br><br>
    <p style='text-align: center;'><img src="https://i.ibb.co/3mxvBKCq/image.png" alt="Cartas extraídas" style="max-width: 100%;"></p>
    ¿Cuál es el puntaje final del jugador?`,
    opciones: ["-14", "-4", "3", "11"],
    correcta: 1
},
// 2. 2026R - Imagen: No - Tabla: Si - Resp: D
{
    pregunta: `Para preparar una receta, una persona necesita 700 g de carne picada, 1 kg de champiñones y 2 cebollas.<br><br>
    Para comprar los ingredientes la persona considera los siguientes precios:<br><br>
    <table class='table' style='border-collapse: collapse; width: 80%; margin: 10px auto; text-align: center;'>
        <thead>
            <tr style='background-color: #f2f2f2;'>
                <th style='border: 1px solid #999; padding: 8px;'>Producto</th>
                <th style='border: 1px solid #999; padding: 8px;'>Precio</th>
            </tr>
        </thead>
        <tbody>
            <tr><td style='border: 1px solid #999; padding: 8px;'>100 g de carne picada</td><td style='border: 1px solid #999; padding: 8px;'>$900</td></tr>
            <tr><td style='border: 1px solid #999; padding: 8px;'>0,5 kg de champiñón</td><td style='border: 1px solid #999; padding: 8px;'>$3500</td></tr>
            <tr><td style='border: 1px solid #999; padding: 8px;'>1 cebolla</td><td style='border: 1px solid #999; padding: 8px;'>$200</td></tr>
        </tbody>
    </table>
    ¿Cuánto dinero necesita la persona para comprar los ingredientes para esta receta?`,
    opciones: ["$4600", "$8100", "$10000", "$13700"],
    correcta: 3
},
// 3. 2026R - Imagen: No - Tabla: No - Resp: D
{
    pregunta: `Un auto recorre 5 km para ir de la ciudad A a la ciudad B y recorre 25 km para ir de la ciudad B a la ciudad C.<br><br>
    Si este auto rinde 10 kilómetros por litro, es decir, recorre 10 km con 1 litro de bencina, ¿cuál es la cantidad de litros de bencina que se necesitan para hacer el recorrido de la ciudad A hasta la ciudad C de ida y vuelta, pasando ambas veces por la ciudad B?`,
    opciones: ["2", "3", "4", "6"],
    correcta: 3
},
// 4. 2027I - Imagen: No - Tabla: No - Resp: C
{
    pregunta: `Considera el siguiente modelo que permite estimar la estatura, en centímetros, que tendrán niñas y niños cuando terminen su desarrollo.<br><br>
    <p style='text-align: center;'>\\( \\frac{\\text{Estatura del padre } (\\text{cm}) + \\text{estatura de la madre } (\\text{cm}) + 13 \\cdot P}{2} \\)</p><br>
    tal que:<br><br>
    • \\(P = 1\\), si su sexo es masculino.<br>
    • \\(P = -1\\), si su sexo es femenino.<br><br>
    ¿Cuál será la estatura estimada de un niño de sexo masculino cuando termine su desarrollo si su madre mide 159 cm y su padre mide 168 cm?`,
    opciones: ["157 cm", "163,5 cm", "170 cm", "176,5 cm"],
    correcta: 2
},
// 5. 2026I - Imagen: Si - Tabla: No - Resp: B
{
    pregunta: `En el gráfico adjunto se representa la percepción ciudadana en relación con los atributos de un candidato. Esta percepción se presenta en un puntaje que va de -20 a 20 puntos.<br><br>
    <p style='text-align: center;'><img src="https://i.ibb.co/7Jkx7vM0/image.png" alt="Gráfico de percepción ciudadana" style="max-width: 100%;"></p>
    ¿Cuál de los atributos presentó una mayor variación en su puntaje según la percepción ciudadana, entre agosto y noviembre?`,
    opciones: ["Liderazgo", "Cercanía", "Honestidad", "Capacidad de diálogo"],
    correcta: 1
},
// 6. 2026I - Imagen: Si - Tabla: No - Resp: B
{
    pregunta: `En un juego, en cada partida un jugador debe responder 10 preguntas de cultura general y tiene la opción de no contestar en 4 oportunidades.<br><br>
    • Cuando el jugador da una respuesta correcta gana una ficha blanca que vale 1 punto,<br>
    • y cuando da una respuesta incorrecta gana una ficha negra que vale -1 punto.<br><br>
    Luego de tres partidas completas, una persona que jugó este juego, quedó con las siguientes fichas:<br><br>
    <p style='text-align: center;'><img src="https://i.ibb.co/WWjWq1Nc/image.png" alt="Fichas obtenidas en las tres partidas" style="max-width: 100%;"></p>
    ¿Cuál de las siguientes expresiones representa el puntaje final de este jugador luego de estas tres partidas?`,
    opciones: [
        "\\((5 \\cdot 1 - (5 \\cdot -1)) + (5 \\cdot 1 - (4 \\cdot -1)) + (4 \\cdot 1 - (2 \\cdot -1))\\)",
        "\\((5 \\cdot 1 + 5 \\cdot -1) + (5 \\cdot 1 + 4 \\cdot -1) + (4 \\cdot 1 + 2 \\cdot -1)\\)",
        "\\((5 \\cdot -1 + 5 \\cdot 1) + (5 \\cdot -1 + 4 \\cdot 1) + (4 \\cdot -1 + 2 \\cdot 1)\\)",
        "\\((5 \\cdot 1 + 5 \\cdot 1) + (5 \\cdot 1 + 4 \\cdot 1) + (4 \\cdot 1 + 2 \\cdot 1)\\)"
    ],
    correcta: 1
},
// 7. 2027I - Imagen: No - Tabla: No - Resp: A
{
    pregunta: `¿Cuál es el valor de \\(2 \\cdot (2\\sqrt{3}) \\cdot \\sqrt{3}\\)?`,
    opciones: ["12", "\\(4\\sqrt{18}\\)", "\\(12\\sqrt{3}\\)", "24"],
    correcta: 0
},
// 8. 2027I - Imagen: Si - Tabla: No - Resp: C
{
    pregunta: `Considera las siguientes botellas de agua y sus respectivas capacidades en L.<br><br>
    <p style='text-align: center;'><img src="https://i.ibb.co/BVFLm1fh/image.png" alt="Botellas de agua" style="max-width: 300px;"></p>
    ¿Cuál de las siguientes expresiones representa la diferencia de capacidad entre ambas botellas, en litros?`,
    opciones: [
        "\\((2 - 1) - \\left(\\frac{1}{4} + \\frac{1}{8}\\right)\\)",
        "\\((2 - 1) + \\left(\\frac{1}{4} - \\frac{1}{8}\\right)\\)",
        "\\((2 - 1) + \\left(\\frac{1}{8} - \\frac{1}{4}\\right)\\)",
        "\\((2 + 1) - \\left(\\frac{1}{8} + \\frac{1}{4}\\right)\\)"
    ],
    correcta: 2
},
// 9. 2026I - Imagen: Si - Tabla: No - Resp: C
{
    pregunta: `La masa molar de un compuesto químico se calcula sumando las masas molares de todos los átomos que lo conforman.<br><br>
    Considera el compuesto denominado ácido sulfúrico y la información que se presenta a continuación:<br><br>
    <p style='text-align: center;'><img src="https://i.ibb.co/nMYrhRPP/image.png" alt="Composición del ácido sulfúrico" style="max-width: 300px;"></p>
    <table class='table' style='border-collapse: collapse; width: 40%; margin: 10px auto; text-align: center;'>
        <thead>
            <tr style='background-color: #f2f2f2;'>
                <th style='border: 1px solid #999; padding: 8px;'>Átomo</th>
                <th style='border: 1px solid #999; padding: 8px;'>Masa molar (g/mol)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td style='border: 1px solid #999; padding: 8px;'>H</td><td style='border: 1px solid #999; padding: 8px;'>1</td></tr>
            <tr><td style='border: 1px solid #999; padding: 8px;'>S</td><td style='border: 1px solid #999; padding: 8px;'>32</td></tr>
            <tr><td style='border: 1px solid #999; padding: 8px;'>O</td><td style='border: 1px solid #999; padding: 8px;'>16</td></tr>
        </tbody>
    </table>
    ¿Cuál de las siguientes expresiones representa la masa molar del ácido sulfúrico?`,
    opciones: [
        "\\((1 + 32 + 16)\\text{ g/mol}\\)",
        "\\((2 + 4) \\cdot (32 + 16)\\text{ g/mol}\\)",
        "\\((2 \\cdot 1 + 1 \\cdot 32 + 4 \\cdot 16)\\text{ g/mol}\\)",
        "\\((1 + 2 + 4) \\cdot (1 + 32 + 16)\\text{ g/mol}\\)"
    ],
    correcta: 2
},
// 10. 2027I - Imagen: No - Tabla: No - Resp: D
{
    pregunta: `Para calcular el monto final de dinero que se tendrá por medio de un interés simple mensual del \\(i\\%\\), después de una cantidad \\(n\\) de meses, se utiliza la siguiente expresión:<br><br>
    \\(C_f = C_i \\left(1 + \\frac{i \\cdot n}{100}\\right)\\)<br><br>
    tal que \\(C_f\\) es el monto final de dinero y \\(C_i\\) es el monto inicial de dinero.<br><br>
    Considera una inversión con un monto inicial de $100 000 al que se le aplica un interés simple mensual del 20%.<br><br>
    ¿Cuánto dinero se tendrá transcurridos 5 meses?`,
    opciones: ["$102 000", "$110 000", "$120 000", "$200 000"],
    correcta: 3
},
// 11. 2026R - Imagen: No - Tabla: No - Resp: C
{
    pregunta: `La escalera de un edificio tiene 20 peldaños entre piso y piso. La altura de cada uno de estos peldaños es de 15 cm.<br><br>
    Una persona empieza a subir por la escalera de este edificio, desde el primer peldaño del primer piso.<br><br>
    Si \\(n\\) es la cantidad de peldaños que la persona ha subido, ¿cuál de las siguientes condiciones garantiza que la persona llegó a un nuevo piso?`,
    opciones: [
        "Que \\(15 \\cdot n\\) es divisible por 20.",
        "Que \\(15 + n\\) es divisible por 20.",
        "Que \\(15 \\cdot n\\) es divisible por 300.",
        "Que \\(15 + n\\) es divisible por 300."
    ],
    correcta: 2
},
// 12. 2027I - Imagen: No - Tabla: No - Resp: A
{
    pregunta: `En la entrada de una obra de teatro, hay una persona encargada de recibir los tickets de entrada de los asistentes.<br><br>
    Si se estima que la persona encargada recibe 15 tickets cada 60 segundos, ¿cuál de las siguientes expresiones permite estimar la cantidad de tickets que recibe cada \\(t\\) minutos?`,
    opciones: ["\\(15t\\)", "\\(900t\\)", "\\(4t\\)", "\\(\\frac{t}{900}\\)"],
    correcta: 0
},
// 13. 2026I - Imagen: Si - Tabla: No - Resp: C
{

    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectRandomExcludedQuestions() {
  const indices = Array.from({ length: questions.length }, (_, i) => i);
  const shuffled = shuffleArray(indices);
  excludedQuestions = shuffled.slice(0, 5).sort((a, b) => a - b);
}

function shuffleOptionsForQuestion(q) {
  const indices = [0, 1, 2, 3];
  const shuffledIndices = shuffleArray(indices);
  const newOpts = shuffledIndices.map(i => q.opciones[i]);
  const newAns = shuffledIndices.indexOf(q.correcta);
  return { opts: newOpts, ansIdx: newAns };
}

function buildTest() {
  shuffledOptions = questions.map(q => shuffleOptionsForQuestion(q));
  userAnswers = {};
  currentQuestion = 0;
  submitted = false;
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
  startTime = new Date();
  totalSeconds = 0;
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  if (submitted) return;
  totalSeconds = Math.floor((new Date() - startTime) / 1000);
  const tiempoRestante = MAX_TIME_SECONDS - totalSeconds;
  const timerEl = document.getElementById('timer');

  if (tiempoRestante <= 0) {
    clearInterval(timerInterval);
    timerEl.textContent = '00:00';
    timerEl.className = 'timer timer-rojo timer-urgente';
    showResults();
    return;
  }

  const hours = Math.floor(tiempoRestante / 3600);
  const minutes = Math.floor((tiempoRestante % 3600) / 60);
  const seconds = tiempoRestante % 60;
  
  if (hours > 0) {
    timerEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  } else {
    timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  }

  if (tiempoRestante <= 300) {
    timerEl.className = 'timer timer-rojo timer-urgente';
  } else if (tiempoRestante <= 900) {
    timerEl.className = 'timer timer-naranja';
  } else {
    timerEl.className = 'timer';
  }
}

function formatTime(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;
  if (hours > 0) return `${hours}h ${minutes}m ${secs}s`;
  if (minutes > 0) return `${minutes}m ${secs}s`;
  return `${secs}s`;
}

// ============================================================
// RENDERIZADO
// ============================================================
function renderQuestion() {
  const q = questions[currentQuestion];
  const optData = shuffledOptions[currentQuestion];
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;

  let optionsHtml = '';
  const letters = ['A', 'B', 'C', 'D'];
  optData.opts.forEach((opt, idx) => {
    const isSelected = userAnswers[currentQuestion] === idx;
    optionsHtml += `
      <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${idx})">
        <strong>${letters[idx]}.</strong> ${opt}
      </div>
    `;
  });

  document.getElementById('quizContent').innerHTML = `
    <div class="question-card">
      <div class="question-header">
        <div class="question-number">PREGUNTA ${currentQuestion + 1} de ${questions.length}</div>
        <div class="question-status">${userAnswers[currentQuestion] !== undefined ? '✓ Respondida' : '⚪ Sin responder'}</div>
      </div>
      <div class="question-text">${q.pregunta}</div>
      <div class="options">${optionsHtml}</div>
    </div>
  `;
  
  updateNavigationButtons();
  setTimeout(() => {
    if (window.renderMathInElement) {
      renderMathInElement(document.getElementById('quizContent'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }, 50);
}

function selectOption(index) {
  if (submitted) return;
  userAnswers[currentQuestion] = index;
  renderQuestion();
}

function updateNavigationButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = currentQuestion === 0;
  nextBtn.textContent = currentQuestion === questions.length - 1 ? 'Ver Resultados' : 'Siguiente →';
}

function previousQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (currentQuestion === questions.length - 1) {
    showResults();
  } else {
    currentQuestion++;
    renderQuestion();
  }
}

// ============================================================
// RESULTADOS
// ============================================================
function showResults() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0;
  let resultsHtml = '';

  questions.forEach((question, index) => {
    const isExcluded = excludedQuestions.includes(index);
    if (!isExcluded && userAnswers[index] === shuffledOptions[index].ansIdx) {
      correct++;
    }
  });

  // Escalar el puntaje PAES según preguntas consideradas (55)
  const considered = questions.length - excludedQuestions.length;
  const scoreIndex = Math.round((correct / considered) * (paesScores.length - 1));
  const paesScore = paesScores[Math.min(scoreIndex, paesScores.length - 1)];

  // Preguntas excluidas
  let excludedHtml = `
    <div class="excluded-questions">
      <strong>⚠️ Preguntas NO consideradas para el puntaje:</strong><br>
      Las siguientes ${excludedQuestions.length} preguntas fueron seleccionadas aleatoriamente y no afectan tu puntaje:
      <ul style="margin-top:8px; margin-left:20px;">
  `;
  excludedQuestions.forEach(i => {
    excludedHtml += `<li>Pregunta ${i + 1}</li>`;
  });
  excludedHtml += `</ul></div>`;

  const letters = ['A', 'B', 'C', 'D'];

  // Detalle de TODAS las preguntas
  questions.forEach((question, index) => {
    const userAnswer = userAnswers[index];
    const isExcluded = excludedQuestions.includes(index);
    const optData = shuffledOptions[index];
    const isCorrect = userAnswer === optData.ansIdx;
    const answered = userAnswer !== undefined;

    const userAnswerText = answered
      ? `${letters[userAnswer]}) ${optData.opts[userAnswer]}`
      : '<em>Sin respuesta</em>';

    const correctAnswerText = `${letters[optData.ansIdx]}) ${optData.opts[optData.ansIdx]}`;

    // Determinar clase de estado
    let stateClass, stateLabel;
    if (isExcluded) {
      stateClass = 'excluded';
      stateLabel = '⚪ NO CONSIDERADA';
    } else if (!answered) {
      stateClass = 'unanswered';
      stateLabel = '⚫ SIN RESPONDER';
    } else if (isCorrect) {
      stateClass = 'correct';
      stateLabel = '✅ CORRECTA';
    } else {
      stateClass = 'incorrect';
      stateLabel = '❌ INCORRECTA';
    }

    // Mostrar el enunciado COMPLETO (sin truncar)
    resultsHtml += `
      <div class="result-item ${stateClass}">
        <div class="result-header">
          <div class="q-title">Pregunta ${index + 1}</div>
          <span class="q-badge ${stateClass}">${stateLabel}</span>
        </div>
        <div class="q-statement">${question.pregunta}</div>
        <div class="answer-block">
          <div class="answer-line ${isCorrect && !isExcluded ? 'ok' : (answered && !isExcluded ? 'bad' : '')}">
            <span class="answer-label">Tu respuesta:</span>
            <span class="answer-value">${userAnswerText}</span>
          </div>
          <div class="answer-line ok">
            <span class="answer-label">Respuesta correcta:</span>
            <span class="answer-value">${correctAnswerText}</span>
          </div>
          ${isExcluded ? `<div class="answer-note">⚠️ Esta pregunta no se consideró para el cálculo del puntaje</div>` : ''}
        </div>
      </div>
    `;
  });

  document.getElementById('quizContent').innerHTML = `
    <div class="results-container">
      <div class="score-display">
        <h3>📊 Tu Puntaje PAES</h3>
        <div class="score-number">${paesScore} puntos</div>
        <div class="score-description">✅ Correctas: ${correct} de ${considered} preguntas consideradas</div>
        <div class="score-description">⏱️ Tiempo total: ${formatTime(totalSeconds)}</div>
      </div>
      ${excludedHtml}
      <div class="results-list">${resultsHtml}</div>
      <button class="restart-btn" onclick="restartExam()">🔄 Reiniciar Ensayo</button>
    </div>
  `;

  document.getElementById('navButtons').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';

  setTimeout(() => {
    if (window.renderMathInElement) {
      renderMathInElement(document.getElementById('quizContent'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }, 50);
}

function restartExam() {
  clearInterval(timerInterval);
  selectRandomExcludedQuestions();
  buildTest();
  currentQuestion = 0;
  submitted = false;
  startTimer();
  renderQuestion();
  document.getElementById('navButtons').style.display = 'flex';
  document.getElementById('progressBar').style.width = '0%';
}

// ============================================================
// INICIALIZACIÓN
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  selectRandomExcludedQuestions();
  buildTest();
  startTimer();
  renderQuestion();
  setTimeout(() => {
    if (window.renderMathInElement) {
      renderMathInElement(document.getElementById('quizContent'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }, 100);
});
</script>
